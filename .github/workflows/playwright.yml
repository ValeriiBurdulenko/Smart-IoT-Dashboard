name: E2E Full Stack Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Step 1 - Start Core Infrastructure
        working-directory: ./
        env:
          IOT_PUBLIC_HOST: localhost
        run: docker compose --profile apps up -d --wait postgres keycloak kafka zookeeper influxdb redis mosquitto rabbitmq flink-jobmanager flink-taskmanager

      - name: Step 2 - Run Init Scripts
        working-directory: ./
        env:
          IOT_PUBLIC_HOST: localhost
        run: docker compose --profile apps --profile flink-submit up kafka-setup flink-submit

      - name: Step 3 - Start Application Layer
        working-directory: ./
        env:
          IOT_PUBLIC_HOST: localhost
          SPRING_HOST_HTTP: user-device-service
          FRONTEND_HOST_PORT: 5173
        run: docker compose --profile apps up -d --wait user-device-service frontend

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
